<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plan Calendar demo</title>
<style>
  body { font: 14px system-ui, sans-serif; margin: 0 0 120px; color: #1d2433; background: #f6f7f9; }
  header { display: flex; gap: 12px; align-items: center; padding: 10px 16px; background: #fff; border-bottom: 1px solid #dde1e8; flex-wrap: wrap; }
  #banner { background: #fff6d6; padding: 8px 16px; border-bottom: 1px solid #ecd98a; }
  #model-badge { margin-left: auto; padding: 2px 8px; border-radius: 10px; background: #e6eefc; font-size: 12px; }
  main { padding: 12px 16px; }
  #calendar { position: relative; padding-left: 48px; background: #fff; border: 1px solid #dde1e8; border-radius: 6px; user-select: none; }
  .heads { display: grid; grid-template-columns: repeat(7, 1fr); height: 24px; line-height: 24px; text-align: center; font-weight: 600; border-bottom: 1px solid #dde1e8; }
  #axis { position: absolute; left: 0; top: 25px; width: 48px; }
  #axis span { position: absolute; right: 6px; font-size: 11px; color: #667; transform: translateY(-50%); }
  #grid { position: relative; }
  .daycol { position: absolute; top: 0; bottom: 0; border-left: 1px solid #e6e9ee; }
  .blk { position: absolute; box-sizing: border-box; overflow: hidden; padding: 2px 4px; font-size: 11px; border-radius: 4px; touch-action: none; }
  .blk.event { background: #d5d8de; color: #555; border: 1px solid #b9bec7; }
  .blk.proposed { background: #d8f2dc; border: 2px dashed #2e9b45; cursor: grab; }
  .blk.moved { border: 4px solid #1c7a33; }
  .blk.candidate { background: #fff1d0; border: 2px dashed #d48a00; cursor: pointer; }
  .blk.drag { opacity: .7; z-index: 5; }
  .tag { font-weight: 700; margin-right: 4px; }
  #notes, #other-weeks { margin: 8px 0; min-height: 18px; color: #445; }
  #detail { background: #fff; border: 1px solid #dde1e8; border-radius: 6px; padding: 8px; margin: 8px 0; }
  footer { position: fixed; left: 0; right: 0; bottom: 0; background: #fff; border-top: 1px solid #dde1e8; padding: 10px 16px; }
  #prompt { min-height: 22px; margin-bottom: 6px; }
  #ask-form { display: flex; gap: 8px; }
  #ask-input { flex: 1; padding: 8px; }
  button { padding: 6px 10px; margin: 2px; cursor: pointer; }
  button.primary { background: #2e9b45; color: #fff; border: 0; border-radius: 4px; }
  .chips { margin-top: 6px; }
</style>
</head>
<body>
<header>
  <strong>Plan Calendar demo</strong>
  <button id="prev" type="button">&lt;</button><span id="week-label"></span><button id="next" type="button">&gt;</button>
  <button id="undo" type="button">Undo</button><button id="reset" type="button">Reset</button>
  <span id="model-badge">Model: recorded</span>
</header>
<div id="banner">Nothing is written to Google Calendar. This is an offline preview with a fake calendar; times are shown in UTC.</div>
<main>
  <div id="calendar"></div>
  <div id="other-weeks"></div>
  <div id="detail" hidden></div>
  <div id="notes" aria-live="polite"></div>
</main>
<footer>
  <div id="prompt" aria-live="polite"></div>
  <form id="ask-form"><input id="ask-input" type="text" placeholder="Ask for a plan" autocomplete="off"><button class="primary" type="submit">Ask</button></form>
  <div class="chips">
    <button class="chip" type="button" data-fill="Find time to work out for half an hour">Find time to work out for half an hour</button>
    <button class="chip" type="button" data-fill="The demo is due next Friday, help me plan the prep">The demo is due next Friday, help me plan the prep</button>
    <button class="chip" type="button" data-fill="Anything fun this week?">Anything fun this week?</button>
    <button class="chip" type="button" data-scene="shopping">Drag shopping later is not an Ask message, use the calendar drag</button>
  </div>
</footer>
<script src="/demo.js"></script>
</body>
</html>
